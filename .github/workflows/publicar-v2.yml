# Publica a versão de teste do Lar em Dia em https://diegodebastiani87-beep.github.io/nossa-rotina/v2/
# Roda a cada envio para a branch v2: testa, gera o app (pasta app/) e copia o resultado para a pasta v2/ da branch main.
# O index.html atual (app antigo) não é tocado.
name: Publicar versão de teste (v2)

on:
  push:
    branches: [v2]
    paths: ['app/**', '.github/workflows/publicar-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-v2
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a branch v2
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar, testar e gerar
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build

      - name: Baixar a branch main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Copiar para main/v2 e enviar
        run: |
          rm -rf site/v2
          mkdir -p site/v2
          cp -r app/dist/. site/v2/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Publica versão de teste v2 (${GITHUB_SHA::7})"
          git push
